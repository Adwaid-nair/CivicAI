<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding: Verified Transparency</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13b474",
                        "background-light": "#f6f8f7",
                        "background-dark": "#0a0e1a",
                        "accent-cyan": "#00e5ff",
                        "accent-purple": "#7c3aed"
                    },
                    fontFamily: {
                        "display": ["Space Grotesk"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display antialiased min-h-screen flex items-center justify-center p-4">
<!-- Mobile Screen Container -->
<div class="relative flex flex-col w-full max-w-[375px] h-[812px] bg-background-light dark:bg-background-dark rounded-[2.5rem] overflow-hidden shadow-2xl border border-accent-cyan/30">
<!-- Main Content Area -->
<div class="flex-1 flex flex-col items-center justify-center p-6 mt-12">
<!-- Glassmorphism layered visual -->
<div class="relative w-64 h-64 mb-10 flex items-center justify-center">
<div class="absolute inset-0 bg-primary/20 rounded-xl blur-2xl"></div>
<div class="absolute w-56 h-56 bg-slate-800/50 glass-card rounded-xl rotate-6"></div>
<div class="absolute w-56 h-56 bg-slate-800/80 glass-card rounded-xl -rotate-3 z-10 flex items-center justify-center">
<div class="w-24 h-24 bg-primary rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(16,185,129,0.5)]">
<span class="material-symbols-outlined text-white text-5xl">verified</span>
</div>
</div>
</div>
<h2 class="text-white tracking-tight text-[28px] font-bold leading-tight text-center pb-3">Verified Transparency</h2>
<p class="text-slate-400 text-base font-normal leading-normal text-center px-2">
                Track every step of the repair process with real-time AI verification and public accountability maps.
            </p>
</div>
<!-- Bottom Controls -->
<div class="flex flex-col items-center px-6 pb-10">
<!-- Pagination Dots -->
<div class="flex flex-row items-center justify-center gap-3 py-6">
<div class="h-2 w-2 rounded-full bg-slate-700"></div>
<div class="h-2 w-6 rounded-full bg-accent-cyan"></div>
<div class="h-2 w-2 rounded-full bg-slate-700"></div>
</div>
<!-- Action Button -->
<button class="w-full h-14 rounded-full bg-gradient-to-r from-accent-purple to-accent-cyan flex items-center justify-center text-white text-lg font-bold tracking-wide shadow-lg hover:opacity-90 transition-opacity">
<span>Continue</span>
<span class="material-symbols-outlined ml-2 text-xl">arrow_forward</span>
</button>
</div>
</div>
</body></html>
